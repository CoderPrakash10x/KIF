# LOCAL DEV dependencies only:  docker compose up -d
#  - MongoDB single-node replica set (transactions need one)  -> mongodb://localhost:27017
#  - Mailpit: catches all outgoing e-mail (verification / reset links) -> UI http://localhost:8025
services:
  mongo:
    image: mongo:7
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports: ["27017:27017"]
    volumes: ["mongo-data:/data/db"]
    healthcheck:
      test: >
        mongosh --quiet --eval
        "try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]}).ok }"
      interval: 5s
      timeout: 20s
      retries: 20
  mailpit:
    image: axllent/mailpit
    ports: ["1025:1025", "8025:8025"]
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
volumes:
  mongo-data:
