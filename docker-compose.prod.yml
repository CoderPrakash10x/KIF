# SINGLE-SERVER PRODUCTION (VPS):  cp .env.prod.example .env.prod && docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --build
# Prefer MongoDB Atlas? Delete the `mongo` service and point MONGO_URI at Atlas. Put HTTPS in front (Caddy / Cloudflare / your host's LB).
services:
  mongo:
    image: mongo:7
    command: ["--replSet", "rs0", "--bind_ip_all"]
    volumes: ["mongo-data:/data/db"]        # no published port: only reachable from this compose network
    restart: unless-stopped
    healthcheck:
      test: >
        mongosh --quiet --eval
        "try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}).ok }"
      interval: 5s
      timeout: 20s
      retries: 20
  backend:
    build: ./backend
    restart: unless-stopped
    depends_on: { mongo: { condition: service_healthy } }
    environment:
      NODE_ENV: production
      PORT: "5001"
      MONGO_URI: ${MONGO_URI:-mongodb://mongo:27017/kif-rms?replicaSet=rs0}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      FRONTEND_URL: ${FRONTEND_URL}
      COOKIE_SAMESITE: strict
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
  web:
    build: ./frontend
    restart: unless-stopped
    depends_on: [backend]
    ports: ["80:80"]
volumes:
  mongo-data:
